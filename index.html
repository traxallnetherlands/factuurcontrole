<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TraXall Factuurcontrole</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.min.js"></script>
  <style>
    body, html {
      min-height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #213153;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 30px 20px;
      box-sizing: border-box;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 1400px;
      width: 100%;
    }
    .header-bar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 92px;
      padding: 18px 28px;
      background-color: white;
      border-radius: 10px;
      box-sizing: border-box;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.18);
    }
    .header-bar img {
      position: absolute;
      left: 28px;
      max-width: 180px;
      max-height: 58px;
      width: auto;
      height: auto;
    }
    .header-bar h1 {
      margin: 0;
      color: #213153;
      font-size: 28px;
      text-align: center;
    }

    .top-row {
      display: flex;
      gap: 20px;
      width: 100%;
      justify-content: space-between;
    }

    .container {
      background-color: white;
      border-radius: 10px;
      padding: 20px;
      box-sizing: border-box;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.18);
      flex: 1;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bottom-container {
      width: 100%;
      background-color: white;
      border-radius: 10px;
      padding: 20px;
      box-sizing: border-box;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.18);
    }

    .image-container {
      text-align: center;
    }

    .image-container img {
      max-width: 200px;
      height: auto;
      border-radius: 10px;
    }

    h1 {
      margin: 0;
      color: #213153;
      font-size: 24px;
    }

    h2 {
      margin: 0;
      color: #213153;
      font-size: 18px;
    }

    p {
      margin: 5px 0;
      line-height: 1.4;
      font-size: 14px;
    }

    .dropbox {
      border: 2px dashed #cfd6e4;
      background: #f8faff;
      border-radius: 10px;
      padding: 12px;
      text-align: left;
    }

    .dropbox strong {
      display: block;
      color: #213153;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .hint {
      color: #555;
      font-size: 12px;
      margin-bottom: 6px;
    }

    input[type="file"] {
      width: 100%;
      box-sizing: border-box;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .form-row label {
      font-size: 14px;
      font-weight: bold;
      color: #213153;
    }

    .form-row input[type="number"] {
      width: 80px;
      padding: 6px;
      border: 1px solid #cfd6e4;
      border-radius: 4px;
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      margin-top: 5px;
      height: auto;
      border: 1px solid #cfd6e4;
      padding: 8px;
      border-radius: 6px;
      background: #f8faff;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 5px;
    }

    button {
      background-color: #213153;
      color: white;
      border: none;
      padding: 10px 18px;
      cursor: pointer;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      flex: 1;
    }

    button:hover {
      background-color: #18243d;
    }

    button:disabled {
      background-color: #8894aa;
      cursor: not-allowed;
    }

    .msg {
      margin-top: 5px;
      font-size: 13px;
      color: #333;
      text-align: center;
    }

    .table-section-title {
      color: #213153;
      margin: 20px 0 10px 0;
      font-size: 18px;
      border-bottom: 2px solid #213153;
      padding-bottom: 5px;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border-radius: 8px;
      margin-bottom: 25px;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 5px;
      background: white;
      font-size: 13px;
      min-width: 1000px;
    }

    .table th {
      background-color: #213153;
      color: white;
      padding: 10px 8px;
      text-align: left;
      position: sticky;
      top: 0;
    }

    .table td {
      border-bottom: 1px solid #ddd;
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }

    .align-right {
      text-align: right !important;
      white-space: nowrap;
    }

    .table tr.group-shaded td {
      background-color: #e2e6ec;
    }
.bad {
      color: red;
      font-weight: 700;
    }

    .info-box ul {
      margin: 8px 0 0 20px;
      padding: 0;
    }

    .info-box li {
      margin-bottom: 6px;
      font-size: 13px;
    }

    @media (max-width: 1024px) {
      .top-row {
        flex-direction: column;
      }
      .header-bar {
        justify-content: flex-end;
      }
      .header-bar img {
        left: 20px;
        max-width: 140px;
      }
      .header-bar h1 {
        font-size: 24px;
      }
    }

box label{color:var(--blue);font-weight:700;font-size:12px}.setting-box input[type=number]{width:100%;height:29px;text-align:center;border:1px solid var(--line);border-radius:6px}.unit{color:var(--blue);font-weight:700;font-size:11px}.damage-tools{display:grid;grid-template-columns:1fr 148px;gap:8px;align-items:stretch}.damage-row{display:grid;grid-template-columns:145px 1fr;gap:8px}.damage-title{padding-top:9px;color:var(--blue);font-weight:700}.damage-box{padding:7px 9px}.checkbox-grid{border:0;padding:0;background:transparent;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.plate-box{background:#fff8e8;border:1px solid var(--orange);border-radius:8px;padding:9px;text-align:center;color:var(--blue);font-weight:700}.plate-box label{display:grid;justify-items:center;gap:8px}.process-body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:216px}.languageField{display:grid;gap:7px;text-align:center}.languageButtons{display:flex;justify-content:center;gap:7px}.flagButton{width:48px;height:46px;padding:3px;border:2px solid transparent;background:#e9edf4}.flagButton img{width:100%;height:100%;object-fit:cover;border-radius:50%}.flagButton.selected{border-color:var(--orange);background:#fff8e8}.action-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:300px}.primary,.secondary,.export{height:44px;border-radius:8px}.primary{background:var(--blue);color:#fff}.secondary{background:#e9edf4;color:var(--blue)}.export,.manual-link{display:inline-flex;align-items:center;justify-content:center;width:300px;height:52px;border-radius:8px;font-weight:700}.export{gap:9px;background:var(--green);color:#fff}.manual-body{height:150px;display:flex;align-items:center;justify-content:center}.manual-link{color:#111;background:var(--orange);text-decoration:none;font-size:16px}.category-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.category-tab{background:#e9edf4;color:var(--blue);min-height:44px}.category-tab.active{background:var(--blue);color:#fff;box-shadow:inset 0 -3px 0 var(--orange)}@media(max-width:1100px){.workspace{grid-template-columns:1fr 1fr;grid-template-rows:auto}.files-card,.period-card,.settings-card,.process-card,.manual-card{grid-column:auto;grid-row:auto}.settings-card{grid-column:1/3}}

<body>
  <div class="wrapper">
    <div class="header-bar">
      <img src="logo-traxall.png" alt="TraXall logo" />
      <h1>Factuurcontrole</h1>
      <a class="tools-back-link" href="https://traxallnetherlands.github.io/traxalltools/">&lt; Terug naar TraXall Tools</a>
    </div>

    <div class="workspace"><section class="panel-card files-card"><div class="panel-title">1. Bestanden</div><div class="panel-body uploads"><div class="upload" id="boxAcc"><b>Kostenexport</b><input type="file" id="accFile" accept=".xlsx,.xls"><label class="fileButton" for="accFile">Selecteer of sleep bestand</label></div><div class="upload" id="boxFleet"><b>Full Fleetoverview</b><input type="file" id="fleetFile" accept=".xlsx,.xls"><label class="fileButton" for="fleetFile">Selecteer of sleep bestand</label></div></div></section><section class="panel-card period-card"><div class="panel-title">2. Periode</div><div class="panel-body period-controls"><div class="date-field"><label>Vanaf</label><input id="fromDate" type="date"></div><div class="date-field"><label>Tot en met</label><input id="toDate" type="date"></div></div></section><section class="panel-card settings-card"><div class="panel-title">3. Instellingen</div><div class="panel-body setting-list"><div class="setting-box"><label>Inactieve auto's: status sinds negeren binnen:</label><input type="number" id="ignoreInactiveMonths" value="1" step="0.5" min="0"><span class="unit">Maand(en)</span></div><div class="setting-box"><label>Actieve auto's: status sinds negeren binnen:</label><input type="number" id="ignoreActiveMonths" value="0.5" step="0.5" min="0"><span class="unit">Maand(en)</span></div><div class="setting-box"><label>Leasetarief verschil negeren binnen:</label><input type="number" id="ignoreLeaseDiff" value="0.05" step="0.01" min="0"><span class="unit">Euro</span></div><div class="setting-box"><label>Eigen risico klant:</label><input type="number" id="ownRiskAmount" value="0" step="5" min="0"><span class="unit">Euro</span></div><div class="setting-box"><label>Contractaanpassingen negeren binnen:</label><input type="number" id="ignoreContractAdj" value="0" step="1" min="0"><span class="unit">Euro</span></div><div class="damage-tools"><div class="damage-row"><div class="damage-title">Schades negeren:</div><div class="damage-box"><div class="checkbox-grid"><label class="checkbox-label"><input type="checkbox" class="damage-ignore" value="Bandenschade"> Bandenschade</label><label class="checkbox-label"><input type="checkbox" class="damage-ignore" value="Diefstal"> Diefstal</label><label class="checkbox-label"><input type="checkbox" class="damage-ignore" value="Eigen risico"> Eigen risico</label><label class="checkbox-label"><input type="checkbox" class="damage-ignore" value="Onderhoud doorbelast"> Onderhoud doorbelast</label><label class="checkbox-label"><input type="checkbox" class="damage-ignore" value="Overige schadekosten"> Overige schadekosten</label><label class="checkbox-label"><input type="checkbox" class="damage-ignore" value="Ruitschade"> Ruitschade</label><label class="checkbox-label"><input type="checkbox" class="damage-ignore" value="Schade"> Schade</label></div></div></div><div class="plate-box"><label>Kenteken strepen<input type="checkbox" id="plateHyphens"></label></div></div></div></section><section class="panel-card process-card"><div class="panel-title">4. Verwerken</div><div class="panel-body process-body"><div class="languageField"><label>Taal controle</label><div class="languageButtons"><button class="flagButton selected" id="langNl" data-lang="nl"><img src="vlag-nl.png"></button><button class="flagButton" id="langEn" data-lang="en"><img src="vlag-eng.png"></button></div></div><div class="action-row"><button id="matchBtn" class="primary" disabled>Verwerken</button><button id="clearBtn" class="secondary">Wissen</button></div><button id="downloadBtn" class="export" disabled><span>Exporteren naar Excel</span></button><div id="message" class="msg"></div></div></section><section class="panel-card manual-card"><div class="panel-body manual-body"><a class="manual-link" href="https://traxallnetherlands.github.io/traxalltools-handleiding/" target="_blank" rel="noopener noreferrer">Handleiding</a></div></section></div>
    <div class="bottom-container">
      <h2 id="resultsHeading">5. Resultaten</h2><div class="category-tabs"><button class="category-tab active" data-category="active">Actief/Inactief gefactureerd</button><button class="category-tab" data-category="lease">Afwijkingen leasetarief</button><button class="category-tab" data-category="damage">Schades en vervangend vervoer</button><button class="category-tab" data-category="variable">Diverse kosten</button></div><div id="result">
        <p style="color: #666; font-style: italic; margin-top: 15px;">Er zijn nog geen bestanden verwerkt. Upload de data en klik op Verwerken.</p>
      </div>
    </div>

  </div>

  <script>
    const FLEET_PLATE_COL = "License Plate";
    const FLEET_CONTRACT_COL = "Monthly Contractual VATex";
    const FLEET_STATUS_COL = "Status";
    const FLEET_LEASCO_COL="Lease Company";const FLEET_SUPPLIER_COL="Fournisseur"; 
    const FLEET_STATUS_DATE_COL = "Status since"; 

    const STATUS_ACTIVE = "actief";
    const STATUS_RETURNING = "inleverproces bezig";
    const STATUS_INACTIVE = "inactief";

    let reportActiveInactiveData = [];
    let reportLeaseData = [];
    let reportDamageData = [];
    let reportVariableCostsData=[];let activeCategory="active",reportLanguage="nl";

    document.getElementById("matchBtn").addEventListener("click", runCheck);
    document.getElementById("downloadBtn").addEventListener("click", downloadXlsx);

    function readExcel(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = function (e) {
          try {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type: "array" });
            const sheetName = wb.SheetNames[0];
            const json = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: "" });
            resolve(json);
          } catch (err) {
            reject(err);
          }
        };
        reader.onerror = () => reject(reader.error);
        reader.readAsArrayBuffer(file);
      });
    }

    function cleanPlate(x) {
      if (!x) return "";
      return x.toString().replace(/[\s\-]/g, "").toUpperCase().trim();
    }

    function toNumber(v) {
      if (v === null || v === undefined) return 0;
      let s = v.toString().trim();
      if (s === "") return 0;

      s = s.replace(/[^\d.,-]/g, "");
      const hasDot = s.includes(".");
      const hasComma = s.includes(",");

      if (hasDot && hasComma) {
        const lastDot = s.lastIndexOf(".");
        const lastComma = s.lastIndexOf(",");
        if (lastComma > lastDot) {
          s = s.replace(/\./g, "").replace(",", ".");
        } else {
          s = s.replace(/,/g, "");
        }
      } else if (hasComma && !hasDot) {
        s = s.replace(",", ".");
      }

      const n = parseFloat(s);
      return Number.isFinite(n) ? n : 0;
    }

    function format2(n) {
      return Number.isFinite(n) ? n.toFixed(2) : "0.00";
    }

    function formatDate(v) {
      if (!v) return "";
      if (Number.isFinite(v) || (!isNaN(v) && !isNaN(parseFloat(v)))) {
        const serial = parseFloat(v);
        const utc_days  = Math.floor(serial - 25569);
        const utc_value = utc_days * 86400;
        const date_info = new Date(utc_value * 1000);
        
        const fractional_day = serial - Math.floor(serial) + 0.0000001;
        let total_seconds = Math.floor(86400 * fractional_day);
        const seconds = total_seconds % 60;
        total_seconds -= seconds;
        const hours = Math.floor(total_seconds / 3600);
        const minutes = Math.floor(total_seconds / 60) % 60;
        
        const d = new Date(date_info.getFullYear(), date_info.getMonth(), date_info.getDate(), hours, minutes, seconds);
        return `${d.getDate()}-${d.getMonth() + 1}-${d.getFullYear()}`;
      }
      return v.toString().trim();
    }

    function parseDisplayDate(v) {
      if (!v) return null;
      if (v instanceof Date && !isNaN(v.getTime())) return v;

      const value = v.toString().trim();
      let match = value.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/);
      if (match) {
        const d = new Date(Number(match[3]), Number(match[2]) - 1, Number(match[1]));
        return isNaN(d.getTime()) ? null : d;
      }

      match = value.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);
      if (match) {
        const d = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
        return isNaN(d.getTime()) ? null : d;
      }

      return null;
    }

    function getEarliestDate(currentValue, candidateValue) {
      if (!candidateValue) return currentValue || "";
      if (!currentValue) return candidateValue;
      const currentDate = parseDisplayDate(currentValue);
      const candidateDate = parseDisplayDate(candidateValue);
      if (!candidateDate) return currentValue;
      if (!currentDate || candidateDate < currentDate) return candidateValue;
      return currentValue;
    }

    function getLatestDate(currentValue, candidateValue) {
      if (!candidateValue) return currentValue || "";
      if (!currentValue) return candidateValue;
      const currentDate = parseDisplayDate(currentValue);
      const candidateDate = parseDisplayDate(candidateValue);
      if (!candidateDate) return currentValue;
      if (!currentDate || candidateDate > currentDate) return candidateValue;
      return currentValue;
    }

    function toExcelDate(v) {
      if (v === null || v === undefined || v === "") return "";
      if (v instanceof Date && !isNaN(v.getTime())) return v;
      const value = v.toString().trim();
      if (!value || value.includes(",")) return value;
      return parseDisplayDate(value) || value;
    }

    function normalizeFleetStatus(v) {
      const s = (v || "").toString().trim().toLowerCase();
      if (s === "active" || s === "actief") return STATUS_ACTIVE;
      if (s.includes("inlever") || s.includes("return") || s.includes("handover")) return STATUS_RETURNING;
      if (s === "inactive" || s === "inactief") return STATUS_INACTIVE;
      return s;
    }

    async function runCheck() {
      document.getElementById("message").textContent = "";
      document.getElementById("downloadBtn").disabled = true;
      document.getElementById("result").innerHTML = "<p>Verwerken...</p>";
      
      reportActiveInactiveData = [];
      reportLeaseData = [];
      reportDamageData = [];
      reportVariableCostsData = [];

      const accFile = document.getElementById("accFile").files[0];
      const fleetFile = document.getElementById("fleetFile").files[0];

      if (!accFile || !fleetFile) {
        alert("Upload beide bestanden");
        document.getElementById("result").innerHTML = "<p class='bad'>Upload beide bestanden.</p>";
        return;
      }

      const leaseAmtThreshold=Math.abs(parseFloat(document.getElementById("ignoreLeaseDiff").value))||0;const inactiveMonthsThreshold=Math.max(0,parseFloat(document.getElementById("ignoreInactiveMonths").value)||0);const activeMonthsThreshold=Math.max(0,parseFloat(document.getElementById("ignoreActiveMonths").value)||0);const fromDateFilter=parseInputDate(document.getElementById("fromDate").value),toDateFilter=parseInputDate(document.getElementById("toDate").value,true);
      const ownRiskThreshold = parseFloat(document.getElementById("ownRiskAmount").value) || 0;
      const ignoreContractAdjThreshold = Math.abs(parseFloat(document.getElementById("ignoreContractAdj").value)) || 0;
      const ignoredDamages = Array.from(document.querySelectorAll('.damage-ignore:checked')).map(cb => cb.value.toLowerCase());

      try {
        const acc = await readExcel(accFile);
        const fleet = await readExcel(fleetFile);

        const fleetMap = {};
        const unvisitedActivePlates = new Set();
        const platesInInvoice = new Set();

        // 1. Bouw Fleet Kaart
        fleet.forEach(f => {
          const plate = cleanPlate(f[FLEET_PLATE_COL]);
          if (!plate) return;

          const contractNum = toNumber(f[FLEET_CONTRACT_COL]);
          const statusRaw = f[FLEET_STATUS_COL] || "";
          const statusNorm = normalizeFleetStatus(statusRaw);
          const statusSince = formatDate(f[FLEET_STATUS_DATE_COL]);
          const leasCo=f[FLEET_LEASCO_COL]||"";const fleetSupplier=f[FLEET_SUPPLIER_COL]||f["Supplier"]||f["Leasing Company"]||leasCo||"";

          fleetMap[plate] = {
            contractNum,
            statusRaw,
            statusNorm,
            statusSince,
            leasCo,fleetSupplier,
            hasInvoiceRecords: false
          };

          if (statusNorm === STATUS_ACTIVE || statusNorm === STATUS_RETURNING) {
            unvisitedActivePlates.add(plate);
          }
        });

        // Eerste pass om te kijken welke kentekens überhaupt voorkomen op de factuur
        acc.forEach(r => {
          const plate = cleanPlate(r["Immat"]);
          if (plate) {
            platesInInvoice.add(plate);
            if (fleetMap[plate]) {
              fleetMap[plate].hasInvoiceRecords = true;
            }
          }
        });

        // 2. Loop door de factuurregels
        const aggLease = {}; 

        acc.forEach(r => {
          const plate = cleanPlate(r["Immat"]);
          if (!plate) return;

          const costType = (r["Type_cout"] || "").toString().trim();
          const product = (r["Produit"] || "").toString().trim();
          const htAmount = toNumber(r["HT"]);
          const invoiceNum = (r["Numero_facture"] || "").toString().trim();
          
          const invoiceDate = formatDate(r["Date"] || r["Date_facture"]);const invoiceDateObject=parseDisplayDate(invoiceDate);if((fromDateFilter&&(!invoiceDateObject||invoiceDateObject<fromDateFilter))||(toDateFilter&&(!invoiceDateObject||invoiceDateObject>toDateFilter)))return;
          // Fallback voor hoofdlettergevoelige/afwijkende kolomnamen (Date_debut / date_debut / Date_debuts etc.)
          const rawDebut = r["Date_debut"] !== undefined ? r["Date_debut"] : (r["date_debut"] !== undefined ? r["date_debut"] : "");
          const rawFin = r["Date_fin"] !== undefined ? r["Date_fin"] : (r["date_fin"] !== undefined ? r["date_fin"] : "");
          
          const startDate = formatDate(rawDebut);
          const endDate = formatDate(rawFin);

          const leasCoInvoice = (r["Fournisseur"] || r["Nom_fournisseur"] || "").toString().trim();

          const f = fleetMap[plate];
          const isInactive = f && f.statusNorm === STATUS_INACTIVE;

          if (f) {
            unvisitedActivePlates.delete(plate);
          }

          // AFWIJKING: Inactieve auto gefactureerd
          if(isInactive&&Math.abs(htAmount)>0.001){const statusDate=f?parseDisplayDate(f.statusSince):null;if(statusDate&&invoiceDateObject&&Math.abs(invoiceDateObject-statusDate)/86400000<=inactiveMonthsThreshold*30)return;
            reportActiveInactiveData.push({
              deviationType: "Inactief - gefactureerd",
              plate: plate,
              status: f ? f.statusRaw : "Inactief",
              statusSince: f ? f.statusSince : "",
              leasCo:leasCoInvoice||(f?f.leasCo:""),fleetSupplier:f?f.fleetSupplier:"",
              invoiceNum: invoiceNum,
              invoiceDate: invoiceDate,
              startDate: startDate,
              endDate: endDate,
              costType: product,
              invoiced: htAmount
            });
            return; 
          }

          if (!isInactive) {
            const costTypeLower = costType.toLowerCase();
            const productLower=product.toLowerCase();const isVV=productLower.includes("vervangend vervoer")||costTypeLower.includes("vervangend vervoer");

            // Check voor 'Diverse kosten' (Boetes, Variabele kosten, Poolkosten, Contractaanpassingen, Meerkilometers)
            const isVariableOrFine = costType === "Variabele kosten" || costType === "Boetes";
            const isPool = costTypeLower.includes("pool");
            const isContractAdj = productLower === "contract aanpassing";
            const isExtraKm = productLower === "meerkilometers";

            if(!isVV&&(isVariableOrFine||isPool||isContractAdj||isExtraKm)&&Math.abs(htAmount)>0.001){
              
              // Als het een Contract aanpassing is, controleer de marge
              if (isContractAdj && Math.abs(htAmount) <= ignoreContractAdjThreshold) {
                return; // Negeren binnen drempelwaarde
              }

              reportVariableCostsData.push({
                plate: plate,
                status: f ? f.statusRaw : "Actief",
                statusSince: f ? f.statusSince : "",
                leasCo:leasCoInvoice||(f?f.leasCo:""),fleetSupplier:f?f.fleetSupplier:"",
                invoiceNum: invoiceNum,
                invoiceDate: invoiceDate,
                startDate: startDate,
                endDate: endDate,
                costType: product || costType,
                invoiced: htAmount
              });
              return; 
            }

            // Check Leasetarief
            if (costType === "Contractuele kosten" && product === "Leasetarief") {
              if (!aggLease[plate]) {
                aggLease[plate] = {
                  plate: plate,
                  lineCount: 0,
                  invoicedSum: 0,
                  invoiceNums: new Set(),
                  invoiceDates: new Set(),
                  earliestStartDate: "",
                  latestEndDate: "",
                  leasCo: leasCoInvoice,
                  statusSince: f ? f.statusSince : ""
                };
              }
              aggLease[plate].lineCount += 1;
              aggLease[plate].invoicedSum += htAmount;
              if (invoiceNum) aggLease[plate].invoiceNums.add(invoiceNum);
              if (invoiceDate) aggLease[plate].invoiceDates.add(invoiceDate);
              aggLease[plate].earliestStartDate = getEarliestDate(aggLease[plate].earliestStartDate, startDate);
              aggLease[plate].latestEndDate = getLatestDate(aggLease[plate].latestEndDate, endDate);
              if (leasCoInvoice) aggLease[plate].leasCo = leasCoInvoice;
            }

            // Schades
            const isDamageProduct = [
              'bandenschade', 'diefstal', 'eigen risico', 
              'onderhoud doorbelast', 'overige schadekosten', 
              'ruitschade', 'schade'
            ].includes(productLower);

            if (isDamageProduct) {
              if (ignoredDamages.includes(productLower)) return;
              
              if (htAmount > ownRiskThreshold) {
                reportDamageData.push({
                  deviationType: "Schade hoger dan eigen risico",
                  plate: plate,
                  status: f ? f.statusRaw : "Actief",
                  statusSince: f ? f.statusSince : "",
                  leasCo:leasCoInvoice||(f?f.leasCo:""),fleetSupplier:f?f.fleetSupplier:"",
                  invoiceNum: invoiceNum,
                  invoiceDate: invoiceDate,
                  startDate: startDate,
                  endDate: endDate,
                  costType: product,
                  invoiced: htAmount,
                  replacementSurplus:htAmount-ownRiskThreshold
                });
              }
            }

            // Vervangend vervoer hoog bedrag
            if(isVV){
              if (htAmount < 0) return; 

              const leaseTariffFleet = f ? f.contractNum : 0;
              const maxAllowedVV = leaseTariffFleet * 0.13;
              
              if (htAmount > maxAllowedVV) {
                const surplus = htAmount - maxAllowedVV;
                reportDamageData.push({
                  deviationType:"Overschot vervangend vervoer 13% van leaseprijs",
                  plate: plate,
                  status: f ? f.statusRaw : "Actief",
                  statusSince: f ? f.statusSince : "",
                  leasCo:leasCoInvoice||(f?f.leasCo:""),fleetSupplier:f?f.fleetSupplier:"",
                  invoiceNum: invoiceNum,
                  invoiceDate: invoiceDate,
                  startDate: startDate,
                  endDate: endDate,
                  costType: product,
                  invoiced: htAmount,
                  replacementSurplus: surplus
                });
              }
            }
          }
        });

        // Aggregaties verwerken voor Leasetarieven
        Object.keys(aggLease).forEach(plate => {
          const a = aggLease[plate];
          const f = fleetMap[plate];
          const fleetLease = f ? f.contractNum : 0;
          const diff = a.invoicedSum - fleetLease;
          const absDiff = Math.abs(diff);

          if (absDiff > leaseAmtThreshold) {
            reportLeaseData.push({
              deviationType: "Verschil leasetarief",
              plate: plate,
              status: f ? f.statusRaw : "Niet in fleet",
              statusSince: f ? f.statusSince : "",
              leasCo:a.leasCo||(f?f.leasCo:""),fleetSupplier:f?f.fleetSupplier:"",
              invoiceNum: Array.from(a.invoiceNums).join(", "),
              invoiceDate: Array.from(a.invoiceDates).join(", "),
              startDate: a.earliestStartDate,
              endDate: a.latestEndDate,
              lineCount: a.lineCount,
              invoiced: a.invoicedSum,
              traxallCosts: fleetLease,
              difference: diff
            });
          }
        });

        // AFWIJKING: Actief kenteken niet gefactureerd
        unvisitedActivePlates.forEach(plate => { const f=fleetMap[plate]; if(!f||f.statusNorm===STATUS_RETURNING)return; const sd=parseDisplayDate(f.statusSince); const ref=toDateFilter||new Date(); if(sd&&Math.abs(ref-sd)/86400000<=activeMonthsThreshold*30)return;
          reportActiveInactiveData.push({
            deviationType: "Actief - Niet gefactureerd",
            plate: plate,
            status: f ? f.statusRaw : "Actief",
            statusSince: f ? f.statusSince : "", 
            leasCo:"",fleetSupplier:f?f.fleetSupplier:"",invoiceNum: "",
            invoiceDate: "",
            startDate: "",
            endDate: "",
            costType: "",
            invoiced: ""
          });
        });

        prepareAllGroupedReports();
        renderHTMLTables();

      } catch (err) {
        console.error(err);
        document.getElementById("result").innerHTML =
          `<p class='bad'>Fout bij het verwerken van de bestanden. Controleer de console (F12) voor details.</p>`;
      }
    }

    function prepareGroupedReport(rows) {
      // Geen sortering toepassen, originele volgorde behouden.
      let previousPlate = null;
      let groupIndex = -1;

      rows.forEach(row => {
        const currentPlate = cleanPlate(row.plate);
        if (currentPlate !== previousPlate) {
          groupIndex += 1;
          previousPlate = currentPlate;
        }
        row._groupShaded = groupIndex % 2 === 1;
      });
    }

    function prepareAllGroupedReports() {
      prepareGroupedReport(reportActiveInactiveData);
      prepareGroupedReport(reportLeaseData);
      prepareGroupedReport(reportDamageData);
      prepareGroupedReport(reportVariableCostsData);
    }

    const COST_EN={'Bandenschade':'Tyre damage','Diefstal':'Theft','Eigen risico':'Customer excess','Onderhoud doorbelast':'Recharged maintenance','Overige schadekosten':'Other damage costs','Ruitschade':'Glass damage','Schade':'Damage','Brandstofafrekening':'Fuel settlement','Poolbeheer':'Pool management','Leasetarief':'Lease rate','Vervangend vervoer':'Replacement transport','Boetes':'Fines','Contract aanpassing':'Contract adjustment','Overige':'Other','Overige Pool':'Other pool costs','Meerkilometers':'Excess mileage','Administratiekosten Boete':'Fine administration costs'},EN={"Inactief - gefactureerd":"Inactive - invoiced","Actief - Niet gefactureerd":"Active - not invoiced","Verschil leasetarief":"Lease rate difference","Schade hoger dan eigen risico":"Damage above customer excess","Overschot vervangend vervoer 13% van leaseprijs":"Replacement transport excess above 13% of lease price","Actief":"Active","Inactief":"Inactive"};const TX={nl:{tabs:{active:"Actief/Inactief gefactureerd",lease:"Afwijkingen leasetarief",damage:"Schades en vervangend vervoer",variable:"Diverse kosten"},cols:{deviationType:"Afwijking",plate:"Kenteken",status:"Status",statusSince:"Status sinds",fleetSupplier:"Leverancier FullFleet",leasCo:"Leverancier factuur",invoiceNum:"Factuurnummer",invoiceDate:"Factuurdatum",startDate:"Start",endDate:"Eind",costType:"Kostensoort",lineCount:"Aantal regels",invoiced:"Bedrag",traxallCosts:"FullFleet",difference:"Verschil",replacementSurplus:"Overschot"}},en:{tabs:{active:"Active/Inactive invoiced",lease:"Lease rate deviations",damage:"Damage and replacement transport",variable:"Miscellaneous costs"},cols:{deviationType:"Deviation",plate:"Registration",status:"Status",statusSince:"Status since",fleetSupplier:"FullFleet supplier",leasCo:"Invoice supplier",invoiceNum:"Invoice number",invoiceDate:"Invoice date",startDate:"Start",endDate:"End",costType:"Cost type",lineCount:"Number of lines",invoiced:"Amount",traxallCosts:"FullFleet",difference:"Difference",replacementSurplus:"Excess"}}};function tr(v, k) {
      if (reportLanguage !== "en") return v;
      if (k === "costType") return COST_EN[v] || v;
      if (k === "deviationType" || k === "status") return EN[v] || v;
      return v;
    }
    function plate(v){const x=cleanPlate(v);if(!document.getElementById('plateHyphens').checked)return x;return x.replace(/([A-Z]+)(?=\d)|([0-9]+)(?=[A-Z])/g,'$&-').split('-').filter(Boolean).slice(0,3).join('-')}function rowsNow(){return activeCategory==='active'?reportActiveInactiveData:activeCategory==='lease'?reportLeaseData:activeCategory==='damage'?reportDamageData:reportVariableCostsData}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
    function renderHTMLTables(){const t=TX[reportLanguage],rows=rowsNow(),right=new Set(['statusSince','invoiceNum','invoiceDate','startDate','endDate','lineCount','invoiced','traxallCosts','difference','replacementSurplus']);document.querySelectorAll('.category-tab').forEach(b=>{b.textContent=t.tabs[b.dataset.category];b.classList.toggle('active',b.dataset.category===activeCategory)});let keys=['deviationType','plate','status','statusSince','fleetSupplier','leasCo','invoiceNum','invoiceDate','startDate','endDate'];if(activeCategory==='active')keys.push('costType','invoiced');if(activeCategory==='lease')keys.push('lineCount','invoiced','traxallCosts','difference');if(activeCategory==='damage')keys.push('costType','invoiced','replacementSurplus');if(activeCategory==='variable')keys.push('costType','invoiced');let h='<div class="table-wrap"><table class="table"><tr>'+keys.map(k=>'<th>'+t.cols[k]+'</th>').join('')+'</tr>';h+=rows.map(r=>'<tr>'+keys.map(k=>'<td style="text-align:'+(right.has(k)?'right':'left')+'">'+esc(k==='plate'?plate(r[k]):tr(r[k]??'',k))+'</td>').join('')+'</tr>').join('');document.getElementById('result').innerHTML=h+'</table></div>';document.getElementById('downloadBtn').disabled=!rows.length}
    function downloadXlsx() {
      const t = TX[reportLanguage];
      const defs = [
        ["active", "Actief-Inactief", reportActiveInactiveData, ["deviationType","plate","status","statusSince","fleetSupplier","leasCo","invoiceNum","invoiceDate","startDate","endDate","costType","invoiced"]],
        ["lease", "Leasetarief", reportLeaseData, ["deviationType","plate","status","statusSince","fleetSupplier","leasCo","invoiceNum","invoiceDate","startDate","endDate","lineCount","invoiced","traxallCosts","difference"]],
        ["damage", "Schades-Vervangend vervoer", reportDamageData, ["deviationType","plate","status","statusSince","fleetSupplier","leasCo","invoiceNum","invoiceDate","startDate","endDate","costType","invoiced","replacementSurplus"]],
        ["variable", "Diverse kosten", reportVariableCostsData, ["deviationType","plate","status","statusSince","fleetSupplier","leasCo","invoiceNum","invoiceDate","startDate","endDate","costType","invoiced"]]
      ];
      const numericFields = new Set(["lineCount","invoiced","traxallCosts","difference","replacementSurplus"]);
      const amountFields = new Set(["invoiced","traxallCosts","difference","replacementSurplus"]);
      const dateFields = new Set(["statusSince","invoiceDate","startDate","endDate"]);
      const right = new Set(["statusSince","invoiceNum","invoiceDate","startDate","endDate","lineCount","invoiced","traxallCosts","difference","replacementSurplus"]);
      const wb = XLSX.utils.book_new();

      for (const [category, nlName, rows, keys] of defs) {
        const data = [
          keys.map(key => t.cols[key]),
          ...rows.map(row => keys.map(key => {
            const value = row[key];
            if (key === "plate") return plate(value);
            if (numericFields.has(key)) {
              if (value === "" || value === null || value === undefined) return "";
              const numberValue = Number(value);
              return Number.isFinite(numberValue) ? numberValue : value;
            }
            if (dateFields.has(key)) {
              if (value === "" || value === null || value === undefined) return "";
              return parseDisplayDate(value) || value;
            }
            return tr(value ?? "", key);
          }))
        ];
        const ws = XLSX.utils.aoa_to_sheet(data, { cellDates: true });
        if (!ws["!ref"]) continue;
        const range = XLSX.utils.decode_range(ws["!ref"]);
        ws["!autofilter"] = { ref: ws["!ref"] };
        ws["!freeze"] = { xSplit: 0, ySplit: 1, topLeftCell: "A2", activePane: "bottomLeft", state: "frozen" };

        for (let col = 0; col <= range.e.c; col++) {
          const head = ws[XLSX.utils.encode_cell({ r: 0, c: col })];
          if (head) head.s = { ...(head.s || {}), font: { ...((head.s || {}).font || {}), bold: true }, alignment: { horizontal: "left", vertical: "center" } };
        }
        for (let row = 1; row <= range.e.r; row++) {
          for (let col = 0; col <= range.e.c; col++) {
            const key = keys[col];
            const cell = ws[XLSX.utils.encode_cell({ r: row, c: col })];
            if (!cell) continue;
            cell.s = { ...(cell.s || {}), alignment: { horizontal: right.has(key) ? "right" : "left", vertical: "center" } };
            if (amountFields.has(key) && typeof cell.v === "number") {
              cell.t = "n";
              cell.z = "#.##0,00";
            } else if (key === "lineCount" && typeof cell.v === "number") {
              cell.t = "n";
              cell.z = "0";
            } else if (dateFields.has(key) && cell.v instanceof Date && !isNaN(cell.v.getTime())) {
              cell.t = "d";
              cell.z = "dd-mm-yyyy";
            }
          }
        }
        const enNames = { active: "Active-Inactive", lease: "Lease rate", damage: "Damage-Replacement", variable: "Misc costs" };
        XLSX.utils.book_append_sheet(wb, ws, reportLanguage === "en" ? enNames[category] : nlName);
      }
      const fileName = (reportLanguage === "en" ? "Invoice_Control" : "Factuurcontrole") + "_" + document.getElementById("fromDate").value + "_" + document.getElementById("toDate").value + ".xlsx";
      XLSX.writeFile(wb, fileName);
    }
    
    function parseInputDate(v,e=false){if(!v)return null;return new Date(v+(e?'T23:59:59':'T00:00:00'))}function setDefaultPeriod(){const now=new Date(),from=new Date(now.getFullYear(),now.getMonth()-1,1),to=new Date(now.getFullYear(),now.getMonth(),0),fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;document.getElementById('fromDate').value=fmt(from);document.getElementById('toDate').value=fmt(to)}function setLanguage(x){reportLanguage=x;document.querySelectorAll('.flagButton').forEach(b=>b.classList.toggle('selected',b.dataset.lang===x));renderHTMLTables()}function ready(){document.getElementById('matchBtn').disabled=!(document.getElementById('accFile').files[0]&&document.getElementById('fleetFile').files[0])}document.querySelectorAll('.category-tab').forEach(b=>b.onclick=()=>{activeCategory=b.dataset.category;renderHTMLTables()});document.getElementById('langNl').onclick=()=>setLanguage('nl');document.getElementById('langEn').onclick=()=>setLanguage('en');document.getElementById('clearBtn').onclick=()=>location.reload();document.getElementById('plateHyphens').onchange=renderHTMLTables;for(const[id,box]of[['accFile','boxAcc'],['fleetFile','boxFleet']]){const i=document.getElementById(id),e=document.getElementById(box);i.onchange=()=>{e.classList.add('ready');e.querySelector('.fileButton').textContent='Upload voltooid';ready()};['dragover','drop'].forEach(x=>e.addEventListener(x,z=>z.preventDefault()));e.addEventListener('drop',z=>{const f=[...(z.dataTransfer?.files||[])].find(f=>/\.xlsx?$/i.test(f.name));if(f){const d=new DataTransfer();d.items.add(f);i.files=d.files;i.onchange()}})}
  setDefaultPeriod();
  </script>
